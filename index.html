<!DOCTYPE html>
<html>
<head>
    <title>Five Hundred Year Old Vampire Character Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Five Hundred Year Old Vampire Character Generator</h1>
    <h2>Classroom Character Creation Tool</h2>

    <div id="scenario">
        <p>Loading scenario...</p>
    </div>

     <div id="generator">

        <h3>Character Options</h3>

        <div class="field">
            <label for="gender-select">
                Gender
            </label>

            <select id="gender-select">
            </select>
        </div>

        <div class="field">
            <label for="name-input">
                First Name
            </label>

            <input
                type="text"
                id="name-input"
                placeholder="Custom name">

            <select id="name-select">
                <option value="">
                    Random
                </option>
            </select>
        </div>

        <button id="generate-button">
            Generate Character
        </button>

    </div>
    <div id="character-output">
            No character generated yet.
    </div>

    <script src="script.js"></script>
</body>
</html>
